name: Déployer sur GitHub Pages

# Se déclenche à chaque push sur main. Le déploiement n'est autorisé que si la gate de
# non-régression ci-dessous passe entièrement.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Gate — syntaxe JavaScript
        shell: bash
        run: |
          set -euo pipefail
          # Tous les .js présents dans le dépôt, y compris PONS et les futurs fichiers :
          # une nouvelle dépendance ne peut donc pas échapper silencieusement à la gate.
          while IFS= read -r -d '' file; do
            echo "node --check $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0 | sort -z)

      - name: Gate — non-régression PLAY
        run: node tests/regression-gate.js

      - name: Bump automatique de CACHE_NAME dans sw.js
        # Chaque déploiement validé reçoit un cache unique dérivé du commit.
        run: |
          NEW_CACHE_NAME="bridge-encheres-${GITHUB_SHA::8}"
          sed -i "s/const CACHE_NAME = '[^']*';/const CACHE_NAME = '${NEW_CACHE_NAME}';/" sw.js
          echo "CACHE_NAME -> ${NEW_CACHE_NAME}"
          grep CACHE_NAME sw.js

      - name: Régénérer donnes/catalogue.json à partir du contenu réel du dossier
        run: |
          python3 -c "
          import json, os
          files = sorted(
              f for f in os.listdir('donnes')
              if f.lower().endswith(('.pbn', '.lin'))
          )
          with open('donnes/catalogue.json', 'w', encoding='utf-8') as out:
              json.dump(files, out, ensure_ascii=False, indent=4)
              out.write('\n')
          print(files)
          "

      - name: Préparer les fichiers pour Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
